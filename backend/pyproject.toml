[project]
name = "qualiforge-backend"
version = "0.1.0"
description = "Backend API and worker for QualiForge."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph>=0.2,<1.0",
    "opentelemetry-api>=1.28,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "prometheus-client>=0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.2,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "temporalio>=1.10,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.uv]
package = false

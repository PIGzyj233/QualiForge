services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qualiforge}
      POSTGRES_USER: ${POSTGRES_USER:-qualiforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qualiforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qualiforge} -d ${POSTGRES_DB:-qualiforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      QUALIFORGE_DATABASE_URL: ${QUALIFORGE_DATABASE_URL:-postgresql://qualiforge:qualiforge@postgres:5432/qualiforge}
      QUALIFORGE_REDIS_URL: ${QUALIFORGE_REDIS_URL:-redis://redis:6379/0}
      QUALIFORGE_GIT_SANDBOX_ROOT: ${QUALIFORGE_GIT_SANDBOX_ROOT:-/data/git-sandbox}
      QUALIFORGE_GIT_SYNC_TIMEOUT_SECONDS: ${QUALIFORGE_GIT_SYNC_TIMEOUT_SECONDS:-120}
      QUALIFORGE_GIT_REPO_SIZE_LIMIT_MB: ${QUALIFORGE_GIT_REPO_SIZE_LIMIT_MB:-1024}
      QUALIFORGE_GIT_DIFF_FILE_LIMIT: ${QUALIFORGE_GIT_DIFF_FILE_LIMIT:-500}
      QUALIFORGE_IMPORT_STORAGE_ROOT: ${QUALIFORGE_IMPORT_STORAGE_ROOT:-/data/imports}
      QUALIFORGE_MODEL_GATEWAY_PROVIDER: ${QUALIFORGE_MODEL_GATEWAY_PROVIDER:-deepseek}
      QUALIFORGE_MODEL_GATEWAY_API_BASE_URL: ${QUALIFORGE_MODEL_GATEWAY_API_BASE_URL:-}
      QUALIFORGE_MODEL_GATEWAY_API_KEY: ${QUALIFORGE_MODEL_GATEWAY_API_KEY:-}
      QUALIFORGE_MODEL_GATEWAY_DEFAULT_MODEL: ${QUALIFORGE_MODEL_GATEWAY_DEFAULT_MODEL:-deepseek-v4-pro}
      QUALIFORGE_MODEL_GATEWAY_REASONING_EFFORT: ${QUALIFORGE_MODEL_GATEWAY_REASONING_EFFORT:-high}
      QUALIFORGE_MODEL_GATEWAY_TIMEOUT_SECONDS: ${QUALIFORGE_MODEL_GATEWAY_TIMEOUT_SECONDS:-30}
      QUALIFORGE_MODEL_GATEWAY_MAX_ATTEMPTS: ${QUALIFORGE_MODEL_GATEWAY_MAX_ATTEMPTS:-3}
      QUALIFORGE_TEMPORAL_ADDRESS: ${QUALIFORGE_TEMPORAL_ADDRESS:-temporal:7233}
      QUALIFORGE_TEMPORAL_NAMESPACE: ${QUALIFORGE_TEMPORAL_NAMESPACE:-default}
      QUALIFORGE_AGENT_TASK_QUEUE: ${QUALIFORGE_AGENT_TASK_QUEUE:-qualiforge-agent-runs}
      QUALIFORGE_AGENT_EXECUTE_SYNC_MODE: ${QUALIFORGE_AGENT_EXECUTE_SYNC_MODE:-false}
      QUALIFORGE_AGENT_MEMORY_ROOT: ${QUALIFORGE_AGENT_MEMORY_ROOT:-/data/agent-memory}
      QUALIFORGE_TELEMETRY_SERVICE_NAME: ${QUALIFORGE_TELEMETRY_SERVICE_NAME:-qualiforge-backend}
      QUALIFORGE_TELEMETRY_OTLP_ENABLED: ${QUALIFORGE_TELEMETRY_OTLP_ENABLED:-false}
      QUALIFORGE_TELEMETRY_OTLP_ENDPOINT: ${QUALIFORGE_TELEMETRY_OTLP_ENDPOINT:-}
      QUALIFORGE_TELEMETRY_OTLP_HEADERS: ${QUALIFORGE_TELEMETRY_OTLP_HEADERS:-}
      QUALIFORGE_TELEMETRY_LANGFUSE_ENABLED: ${QUALIFORGE_TELEMETRY_LANGFUSE_ENABLED:-false}
      QUALIFORGE_TELEMETRY_LANGFUSE_HOST: ${QUALIFORGE_TELEMETRY_LANGFUSE_HOST:-}
      QUALIFORGE_TELEMETRY_LANGFUSE_PUBLIC_KEY: ${QUALIFORGE_TELEMETRY_LANGFUSE_PUBLIC_KEY:-}
      QUALIFORGE_TELEMETRY_LANGFUSE_SECRET_KEY: ${QUALIFORGE_TELEMETRY_LANGFUSE_SECRET_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - git_sandbox_data:/data/git-sandbox
      - import_data:/data/imports
      - agent_memory_data:/data/agent-memory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      QUALIFORGE_DATABASE_URL: ${QUALIFORGE_DATABASE_URL:-postgresql://qualiforge:qualiforge@postgres:5432/qualiforge}
      QUALIFORGE_REDIS_URL: ${QUALIFORGE_REDIS_URL:-redis://redis:6379/0}
      QUALIFORGE_GIT_SANDBOX_ROOT: ${QUALIFORGE_GIT_SANDBOX_ROOT:-/data/git-sandbox}
      QUALIFORGE_GIT_SYNC_TIMEOUT_SECONDS: ${QUALIFORGE_GIT_SYNC_TIMEOUT_SECONDS:-120}
      QUALIFORGE_GIT_REPO_SIZE_LIMIT_MB: ${QUALIFORGE_GIT_REPO_SIZE_LIMIT_MB:-1024}
      QUALIFORGE_GIT_DIFF_FILE_LIMIT: ${QUALIFORGE_GIT_DIFF_FILE_LIMIT:-500}
      QUALIFORGE_IMPORT_STORAGE_ROOT: ${QUALIFORGE_IMPORT_STORAGE_ROOT:-/data/imports}
      QUALIFORGE_MODEL_GATEWAY_PROVIDER: ${QUALIFORGE_MODEL_GATEWAY_PROVIDER:-deepseek}
      QUALIFORGE_MODEL_GATEWAY_API_BASE_URL: ${QUALIFORGE_MODEL_GATEWAY_API_BASE_URL:-}
      QUALIFORGE_MODEL_GATEWAY_API_KEY: ${QUALIFORGE_MODEL_GATEWAY_API_KEY:-}
      QUALIFORGE_MODEL_GATEWAY_DEFAULT_MODEL: ${QUALIFORGE_MODEL_GATEWAY_DEFAULT_MODEL:-deepseek-v4-pro}
      QUALIFORGE_MODEL_GATEWAY_REASONING_EFFORT: ${QUALIFORGE_MODEL_GATEWAY_REASONING_EFFORT:-high}
      QUALIFORGE_MODEL_GATEWAY_TIMEOUT_SECONDS: ${QUALIFORGE_MODEL_GATEWAY_TIMEOUT_SECONDS:-30}
      QUALIFORGE_MODEL_GATEWAY_MAX_ATTEMPTS: ${QUALIFORGE_MODEL_GATEWAY_MAX_ATTEMPTS:-3}
      QUALIFORGE_TEMPORAL_ADDRESS: ${QUALIFORGE_TEMPORAL_ADDRESS:-temporal:7233}
      QUALIFORGE_TEMPORAL_NAMESPACE: ${QUALIFORGE_TEMPORAL_NAMESPACE:-default}
      QUALIFORGE_AGENT_TASK_QUEUE: ${QUALIFORGE_AGENT_TASK_QUEUE:-qualiforge-agent-runs}
      QUALIFORGE_AGENT_EXECUTE_SYNC_MODE: ${QUALIFORGE_AGENT_EXECUTE_SYNC_MODE:-false}
      QUALIFORGE_AGENT_MEMORY_ROOT: ${QUALIFORGE_AGENT_MEMORY_ROOT:-/data/agent-memory}
      QUALIFORGE_TELEMETRY_SERVICE_NAME: ${QUALIFORGE_TELEMETRY_SERVICE_NAME:-qualiforge-worker}
      QUALIFORGE_TELEMETRY_OTLP_ENABLED: ${QUALIFORGE_TELEMETRY_OTLP_ENABLED:-false}
      QUALIFORGE_TELEMETRY_OTLP_ENDPOINT: ${QUALIFORGE_TELEMETRY_OTLP_ENDPOINT:-}
      QUALIFORGE_TELEMETRY_OTLP_HEADERS: ${QUALIFORGE_TELEMETRY_OTLP_HEADERS:-}
      QUALIFORGE_TELEMETRY_LANGFUSE_ENABLED: ${QUALIFORGE_TELEMETRY_LANGFUSE_ENABLED:-false}
      QUALIFORGE_TELEMETRY_LANGFUSE_HOST: ${QUALIFORGE_TELEMETRY_LANGFUSE_HOST:-}
      QUALIFORGE_TELEMETRY_LANGFUSE_PUBLIC_KEY: ${QUALIFORGE_TELEMETRY_LANGFUSE_PUBLIC_KEY:-}
      QUALIFORGE_TELEMETRY_LANGFUSE_SECRET_KEY: ${QUALIFORGE_TELEMETRY_LANGFUSE_SECRET_KEY:-}
    volumes:
      - git_sandbox_data:/data/git-sandbox
      - import_data:/data/imports
      - agent_memory_data:/data/agent-memory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  git_sandbox_data:
  import_data:
  agent_memory_data:
